# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  THREADS: '{{default "16" .THREADS}}'
  INTERFACES: [full, simple, testable, signal_only, weather, "prop-only"]
  # Interfaces whose payloads include protobuf messages.  Kept separate from
  # INTERFACES so the all-JSON list stays a clean control group when checking that a
  # change leaves existing generated output untouched.
  PROTO_INTERFACES: [protoweather]
  PROTO_CONFIG: ./example_interfaces/protobuf-path.toml
  GENERATED_DIR: '{{default "./generated" .GENERATED_DIR}}'

tasks:
  # The aggregate tasks below use `cmds` rather than `deps` because `deps` run in
  # parallel, and each stage transitively depends on the stage before it.  Run in
  # parallel, two stages can therefore drive the same sub-task in the same directory at
  # once -- two concurrent `make -j` runs in one build directory can truncate a static
  # archive.  `cmds` run in sequence, and each stage still fans out over the interfaces
  # in parallel through its own deps, so little parallelism is lost.
  default:
    desc: Generate and compile all interfaces
    cmds:
      - task: python:generate
      - task: python:unittest
      - task: cpp:compile
      - task: rust:unittest
      - task: asyncapi:generate
      - task: markdown:generate
      - task: web:generate
      - task: protobuf:check

  python:
    desc: Generate, test, and type check all Python interfaces
    cmds:
      - task: python:generate
      - task: python:unittest
      - task: python:mypy
      - task: python:docs

  cpp:
    desc: Generate, compile, lint, and test all C++ interfaces
    cmds:
      - task: cpp:generate
      - task: cpp:compile
      - task: cpp:lint
      - task: cpp:unittest

  rust:
    desc: Generate, check, lint, and test all Rust interfaces
    cmds:
      - task: rust:generate
      - task: rust:check
      - task: rust:lint
      - task: rust:unittest

  validate:*:
    desc: Validate a specific interface schema
    sources:
      - schemas/schema.yaml
      - example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml
    cmds:
      - uv run stinger validate ./example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml
    vars:
      IFACE: '{{index .MATCH 0}}'

  validate:
    desc: Validate all interface schemas
    deps:
      - for: { var: INTERFACES }
        task: validate:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: validate:{{ .ITEM }}
    
  python:generate:*:
    desc: Generate Python code for an interface
    deps:
      - task: validate:{{index .MATCH 0}}
    sources:
      - pyproject.toml
      - stingeripc/**/*.py
      - stingeripc/templates/python/**
      - example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml
    generates:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/python/**"
    cmds:
      - mkdir -p {{.GENERATED_DIR}}/{{.IFACE}}/python/
      - uv run stinger generate {{.CLI_ARGS}} --language python --config ./example_interfaces/topic_prefix.toml --config {{.PROTO_CONFIG}} ./example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml {{.GENERATED_DIR}}/{{.IFACE}}/python/
      - uv run black --target-version py312 --exclude '.venv|/proto/' {{.GENERATED_DIR}}/{{.IFACE}}/python/
    vars:
      IFACE: '{{index .MATCH 0}}'

  python37:generate:*:
    desc: Generate Python 3.7 code for an interface with alternative settings
    deps:
      - task: validate:{{index .MATCH 0}}
    sources:
      - pyproject.toml
      - stingeripc/*.py
      - stingeripc/tools/*.py
      - stingeripc/templates/python/**
      - example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml
    generates:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/python37/**"
    cmds:
      - mkdir -p {{.GENERATED_DIR}}/{{.IFACE}}/python37/
      - uv run stinger generate {{.CLI_ARGS}} --language python --config ./example_interfaces/python37.toml --config ./example_interfaces/topic_prefix.toml --config {{.PROTO_CONFIG}} ./example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml {{.GENERATED_DIR}}/{{.IFACE}}/python37/
      - uv run black --target-version py37 --exclude '.venv' {{.GENERATED_DIR}}/{{.IFACE}}/python37/
    vars:
      IFACE: '{{index .MATCH 0}}'

  python37:unittest:*:
    desc: Run generated Python 3.7 unit tests for an interface in Docker
    dir: "{{.GENERATED_DIR}}/{{.IFACE}}/python37/"
    deps:
      - task: python37:generate:{{index .MATCH 0}}
    sources:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/python37/tests/**"
      - "{{.GENERATED_DIR}}/{{.IFACE}}/python37/src/**"
    cmds:
      - docker run --rm -v "$PWD:/workspace" -w /workspace python:3.7-slim sh -c "pip install --no-cache-dir --quiet pytest . && python -m pytest -vv"
    vars:
      IFACE: '{{index .MATCH 0}}'

  python37:unittest:
    desc: Run generated Python 3.7 unit tests for all interfaces in Docker
    deps:
      - for: { var: INTERFACES }
        task: python37:unittest:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: python37:unittest:{{ .ITEM }}

  python-alt1:generate:*:
    desc: Generate Python code for an interface with alternative settings
    deps:
      - task: validate:{{index .MATCH 0}}
    sources:
      - pyproject.toml
      - stingeripc/*.py
      - stingeripc/tools/*.py
      - stingeripc/templates/python/**
      - example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml
    generates:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/python-alt1/**"
    cmds:
      - mkdir -p {{.GENERATED_DIR}}/{{.IFACE}}/python-alt1/
      - uv run stinger generate {{.CLI_ARGS}} --language python --config ./example_interfaces/app-owned-props.toml --config ./example_interfaces/topic_prefix.toml --config {{.PROTO_CONFIG}} ./example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml {{.GENERATED_DIR}}/{{.IFACE}}/python-alt1/
      - uv run black --target-version py312 {{.GENERATED_DIR}}/{{.IFACE}}/python-alt1/
    vars:
      IFACE: '{{index .MATCH 0}}'

  python:generate:
    desc: Generate Python code for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: python:generate:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: python:generate:{{ .ITEM }}
      - for: { var: INTERFACES }
        task: python37:generate:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: python37:generate:{{ .ITEM }}
      - for: { var: INTERFACES }
        task: python-alt1:generate:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: python-alt1:generate:{{ .ITEM }}

  python:unittest:*:
    desc: Run Python unit tests for an interface
    dir: generated/{{.IFACE}}/python/
    deps:
      - task: python:generate:{{index .MATCH 0}}
    sources:
      - example_interfaces/{{.IFACE}}/python/tests/**
      - example_interfaces/{{.IFACE}}/python/src/**
    cmds:
      - task unittest
    vars:
      IFACE: '{{index .MATCH 0}}'

  python-alt1:unittest:*:
    desc: Run Python unit tests for an interface {{.GENERATED_DIR}} with alternative settings
    dir: generated/{{.IFACE}}/python-alt1/
    deps:
      - task: python-alt1:generate:{{index .MATCH 0}}
    sources:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/python-alt1/tests/*.py"
      - "{{.GENERATED_DIR}}/{{.IFACE}}/python-alt1/src/*.py"
    cmds:
      - task unittest
    vars:
      IFACE: '{{index .MATCH 0}}'

  python:unittest:
    desc: Run Python unit tests for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: python:unittest:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: python:unittest:{{ .ITEM }}
      - for: { var: INTERFACES }
        task: python-alt1:unittest:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: python-alt1:unittest:{{ .ITEM }}
      - for: { var: INTERFACES }
        task: python37:unittest:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: python37:unittest:{{ .ITEM }}

  python:mypy:*:
    desc: Run mypy type checking for an interface
    dir: generated/{{.IFACE}}/python/
    deps:
      - task: python:generate:{{index .MATCH 0}}
    sources:
      - ./src/**
      - ./tests/**
    cmds:
      - task lint
    vars:
      IFACE: '{{index .MATCH 0}}'

  python-alt1:mypy:*:
    desc: Run mypy type checking for an interface generated with alternative settings
    dir: generated/{{.IFACE}}/python-alt1/
    deps:
      - task: python-alt1:generate:{{index .MATCH 0}}
    sources:
      - ./src/**
      - ./tests/**
    cmds:
      - task lint
    vars:
      IFACE: '{{index .MATCH 0}}'

  python:mypy:
    desc: Run mypy type checking for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: python:mypy:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: python:mypy:{{ .ITEM }}
      - for: { var: INTERFACES }
        task: python-alt1:mypy:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: python-alt1:mypy:{{ .ITEM }}

  python:docs:*:
    desc: Build Sphinx API docs for an interface
    dir: generated/{{.IFACE}}/python/
    deps:
      - task: python:generate:{{index .MATCH 0}}
    sources:
      - ./src/**
      - ./docs/**
      - ./examples/**
    generates:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/python/docs/_build/html/**"
    cmds:
      - uv sync --group docs
      - uv run sphinx-build -W -b html docs docs/_build/html
    vars:
      IFACE: '{{index .MATCH 0}}'

  python:docs:
    desc: Build Sphinx API docs for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: python:docs:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: python:docs:{{ .ITEM }}

  cpp:generate:*:
    desc: Generate C++ code for an interface
    sources:
      - pyproject.toml
      - stingeripc/*.py
      - stingeripc/tools/*
      - stingeripc/tests/*
      - stingeripc/templates/cpp/**
      - example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml
      - clang-format-config.yaml
    generates:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/examples/**"
      - "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/include/**"
      - "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/src/**"
      - "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/cmake/**"
      - "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/tests/**"
    cmds:
      - uv run stinger generate {{.CLI_ARGS}} --language cpp --config ./example_interfaces/topic_prefix.toml --config {{.PROTO_CONFIG}} ./example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/"
      - clang-format --style=file:clang-format-config.yaml {{.GENERATED_DIR}}/{{.IFACE}}/cpp/include/*.hpp {{.GENERATED_DIR}}/{{.IFACE}}/cpp/src/*.cpp {{.GENERATED_DIR}}/{{.IFACE}}/cpp/examples/*.cpp {{.GENERATED_DIR}}/{{.IFACE}}/cpp/tests/*.cpp -i
    vars:
      IFACE: '{{index .MATCH 0}}'

  cpp:generate:
    desc: Generate C++ code for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: cpp:generate:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: cpp:generate:{{ .ITEM }}

  cpp:compile:*:
    desc: Compile C++ code for an interface
    deps:
      - task: cpp:generate:{{index .MATCH 0}}
    sources:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/**"
    cmds:
      - mkdir -p "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/build"
      - cd "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/build" && cmake .. && make -j {{.THREADS}}
    vars:
      IFACE: '{{index .MATCH 0}}'

  cpp:compile:
    desc: Compile C++ code for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: cpp:compile:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: cpp:compile:{{ .ITEM }}

  cpp:unittest:*:
    desc: Run C++ unit tests for an interface
    dir: "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/"
    deps:
      - task: cpp:generate:{{index .MATCH 0}}
    sources:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/**"
    cmds:
      - task unittest
    vars:
      IFACE: '{{index .MATCH 0}}'

  cpp:unittest:
    desc: Run C++ unit tests for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: cpp:unittest:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: cpp:unittest:{{ .ITEM }}

  cpp:lint:*:
    desc: Check C++ source formatting for an interface
    dir: "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/"
    deps:
      - task: cpp:generate:{{index .MATCH 0}}
    sources:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/cpp/**"
    cmds:
      - task lint
    vars:
      IFACE: '{{index .MATCH 0}}'

  cpp:lint:
    desc: Check C++ source formatting for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: cpp:lint:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: cpp:lint:{{ .ITEM }}

  rust:generate:*:
    desc: Generate Rust code for an interface
    sources:
      - pyproject.toml
      - stingeripc/*.py
      - stingeripc/templates/rust/**
      - example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml
    generates:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/rust/**"
    cmds:
      - uv run stinger generate {{.CLI_ARGS}} --language rust --config ./example_interfaces/topic_prefix.toml --config {{.PROTO_CONFIG}} ./example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml "{{.GENERATED_DIR}}/{{.IFACE}}/rust/"
      # Run twice: rustfmt does not always reach a fixed point in one pass on deeply
      # nested match expressions, so a single run can leave the tree not fully formatted.
      - cd "{{.GENERATED_DIR}}/{{.IFACE}}/rust/" && cargo fmt && cargo fmt
    vars:
      IFACE: '{{index .MATCH 0}}'

  rust:generate:
    desc: Generate Rust code for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: rust:generate:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: rust:generate:{{ .ITEM }}

  rust:check:*:
    desc: Check Rust code for an interface
    dir: "{{.GENERATED_DIR}}/{{.IFACE}}/rust/"
    deps:
      - task: rust:generate:{{index .MATCH 0}}
    sources:
      - ./**
    cmds:
      - cargo check
      - cargo check --example {{.IFACE_SNAKE}}_client_demo --features client
      - cargo check --example {{.IFACE_SNAKE}}_server_demo --features server
      - cargo check --all-features
      - cargo check --example {{.IFACE_SNAKE}}_client_demo --features client,lwt
      - cargo check --example {{.IFACE_SNAKE}}_server_demo --features server,lwt
      - cargo doc --all-features --no-deps
    vars:
      IFACE: '{{index .MATCH 0}}'
      IFACE_SNAKE: '{{index .MATCH 0 | replace "-" "_"}}'

  rust:check:
    desc: Check Rust code for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: rust:check:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: rust:check:{{ .ITEM }}

  rust:unittest:*:
    desc: Run Rust unit tests for an interface
    dir: "{{.GENERATED_DIR}}/{{.IFACE}}/rust/"
    deps:
      - task: rust:generate:{{index .MATCH 0}}
    sources:
      - ./**
    cmds:
      - task unittest
    vars:
      IFACE: '{{index .MATCH 0}}'

  rust:unittest:
    desc: Run Rust unit tests for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: rust:unittest:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: rust:unittest:{{ .ITEM }}

  rust:lint:*:
    desc: Check Rust formatting and run clippy for an interface
    dir: "{{.GENERATED_DIR}}/{{.IFACE}}/rust/"
    deps:
      - task: rust:generate:{{index .MATCH 0}}
    sources:
      - ./**
    cmds:
      - task lint
    vars:
      IFACE: '{{index .MATCH 0}}'

  rust:lint:
    desc: Check Rust formatting and run clippy for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: rust:lint:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: rust:lint:{{ .ITEM }}

  asyncapi:generate:*:
    desc: Generate AsyncAPI documentation for an interface
    deps:
      - task: validate:{{index .MATCH 0}}
    sources:
      - stingeripc/**/*.py
      - example_interfaces/topic_prefix.toml
      - example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml
    generates:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/asyncapi/**"
    cmds:
      - mkdir -p "{{.GENERATED_DIR}}/{{.IFACE}}/asyncapi/"
      - uv run stinger asyncapi {{.CLI_ARGS}} --config ./example_interfaces/topic_prefix.toml --config {{.PROTO_CONFIG}} ./example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml "{{.GENERATED_DIR}}/{{.IFACE}}/asyncapi/"
    vars:
      IFACE: '{{index .MATCH 0}}'

  asyncapi:generate:
    desc: Generate AsyncAPI documentation for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: asyncapi:generate:{{ .ITEM }}

  markdown:generate:*:
    desc: Generate markdown documentation for an interface
    sources:
      - stingeripc/*.py
      - stingeripc/templates/markdown/**
      - example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml
    generates:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/markdown/*"
    cmds:
      - uv run stinger generate {{.CLI_ARGS}} --language markdown --config ./example_interfaces/topic_prefix.toml --config {{.PROTO_CONFIG}} ./example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml "{{.GENERATED_DIR}}/{{.IFACE}}/markdown/"
    vars:
      IFACE: '{{index .MATCH 0}}'
  
  markdown:generate:
    desc: Generate markdown documentation for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: markdown:generate:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: markdown:generate:{{ .ITEM }}

  web:generate:*:
    desc: Generate web documentation for an interface
    sources:
      - stingeripc/**/*.py
      - stingeripc/templates/web/**
      - example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml
    generates:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/web/**"
    cmds:
      - uv run stinger generate {{.CLI_ARGS}} --language web --config ./example_interfaces/topic_prefix.toml --config {{.PROTO_CONFIG}} ./example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml "{{.GENERATED_DIR}}/{{.IFACE}}/web/"
    vars:
      IFACE: '{{index .MATCH 0}}'
  
  web:generate:
    desc: Generate web documentation for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: web:generate:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: web:generate:{{ .ITEM }}
  
  protobuf:generate:*:
    desc: Generate Protobuf code for an interface
    deps:
      - task: validate:{{index .MATCH 0}}
    sources:
      - stingeripc/*/*.py
      - stingeripc/tools/*
      - stingeripc/symbols/protobuf.py
      - stingeripc/templates/protobuf/**
      - example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml
    generates:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/protobuf/**"
    cmds:
      - mkdir -p "{{.GENERATED_DIR}}/{{.IFACE}}/protobuf/"
      - uv run stinger generate {{.CLI_ARGS}} --language protobuf ./example_interfaces/{{.IFACE}}/{{.IFACE}}.stinger.yaml "{{.GENERATED_DIR}}/{{.IFACE}}/protobuf/"
    vars:
      IFACE: '{{index .MATCH 0}}'

  protobuf:generate:
    desc: Generate Protobuf code for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: protobuf:generate:{{ .ITEM }}
      - for: { var: PROTO_INTERFACES }
        task: protobuf:generate:{{ .ITEM }}
  
  protobuf:check:*:
    desc: Check Protobuf code for an interface
    deps:
      - task: protobuf:generate:{{index .MATCH 0}}
    sources:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/protobuf/**"
    cmds:
      - uvx --from=protoc-wrapper@33.0 protoc --proto_path="{{.GENERATED_DIR}}/{{.IFACE}}/protobuf/" --descriptor_set_out=/dev/null "{{.GENERATED_DIR}}/{{.IFACE}}/protobuf/{{.IFACE}}.proto"
    vars:
      IFACE: '{{index .MATCH 0}}'

  protobuf:check:prop-only:
    desc: Check Protobuf code for an interface
    deps:
      - task: protobuf:generate:prop-only
    sources:
      - "{{.GENERATED_DIR}}/{{.IFACE}}/protobuf/**"
    cmds:
      - uvx --from=protoc-wrapper@33.0 protoc --proto_path="{{.GENERATED_DIR}}/{{.IFACE}}/protobuf/" --descriptor_set_out=/dev/null "{{.GENERATED_DIR}}/{{.IFACE}}/protobuf/prop_only.proto"
    vars:
      IFACE: 'prop-only'

  protobuf:check:
    desc: Check Protobuf code for all interfaces
    deps:
      - for: { var: INTERFACES }
        task: protobuf:check:{{ .ITEM }}

  generate:
    desc: Generate code and documentation for all interfaces
    deps:
      - task: python:generate
      - task: cpp:generate
      - task: rust:generate
      - task: asyncapi:generate
      - task: markdown:generate
      - task: web:generate
      - task: protobuf:generate

  docs:
    desc: Build the Sphinx (Read the Docs style) documentation
    sources:
      - docs/**/*.rst
      - docs/**/*.md
      - docs/conf.py
      - stingeripc/**/*.py
    generates:
      - docs/_build/html/**
    cmds:
      - uv run sphinx-build -b html docs/ docs/_build/html/
    silent: false

  docs:clean:
    desc: Remove the built documentation
    cmds:
      - rm -rf docs/_build

  clean:
    desc: Clean all generated files
    cmds:
      - rm -rf "{{.GENERATED_DIR}}/*"
