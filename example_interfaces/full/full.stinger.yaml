stingeripc:
  version: 0.3.0

interface:
  name: Full
  version: 0.0.2
  title: Example Interface
  summary: Example StingerAPI interface which demonstrates many features.

structures:

  favorite_foods:
    documentation: Structure representing someone's favorite foods.
    values:
      - name: drink
        type: string
      - name: slices_of_pizza
        type: integer
      - name: breakfast
        type: string
        optional: true

  lunch:
    documentation: Structure representing a lunch order.
    values:
      - name: drink
        type: boolean
        description: Whether or not lunch comes with a drink
      - name: sandwich
        type: string
        description: The type of sandwich which will be served.
      - name: crackers
        type: float
        description: The number of crackers that come with lunch.
      - name: day
        type: enum
        enumName: dayOfTheWeek
      - name: order_number
        type: integer
        optional: true
      - name: time_of_lunch
        type: datetime
        description: The time when lunch is served.
      - name: duration_of_lunch
        type: duration
        description: The amount of time lunch lasts.

enums:

  dayOfTheWeek:
    documentation: The days of the week.
    values:
      - name: Sunday
        description: First day of the week.
      - name: Monday
      - name: Tuesday
      - name: Wednesday
      - name: Thursday
      - name: Friday
      - name: Saturday

  multiplesOfTen:
    documentation: Enumeration of multiples of ten.
    values:
      - name: Ten
        value: 10
        description: First multiple of ten.
      - name: Twenty
        value: 20
        description: Second multiple of ten.
      - name: Thirty
        value: 30
      - name: Forty
        value: 40
      - name: Fifty
        value: 50

signals:
  
  todayIs:
    values:
      - name: dayOfMonth
        type: integer
        description: The calendar day of the month.
      - name: dayOfWeek
        type: enum
        enumName: dayOfTheWeek

  randomWord:
    values:
      - name: word
        type: string
      - name: time
        type: datetime

methods:

  addNumbers:
    arguments:
      - name: first
        type: integer
      - name: second
        type: integer
      - name: third
        type: integer
        optional: true
    returnValue:
      name: sum
      type: integer

  doSomething:
    arguments:
      - name: task_to_do
        type: string
    returnValue:
      name: label
      type: string

  what_time_is_it:
    documentation: Get the current date and time.
    arguments: []
    returnValue:
      name: timestamp
      type: datetime

  hold_temperature:
    documentation: Hold a temperature for a specified duration.
    arguments:
      - name: temperature_celsius
        type: float
        description: The temperature to hold in degrees Celsius.
    returnValue:
      name: success
      type: boolean

commands:

  set_the_table:
    documentation: |
      Tell the server to lay the table for a meal.  Nothing is sent back; the
      client does not learn whether the table was actually set.
    arguments:
      - name: seats
        type: integer
        description: How many places to lay.
      - name: day
        type: enum
        enumName: dayOfTheWeek
        description: The day the meal is served.
      - name: serve_at
        type: datetime
        description: When the meal should be served.
        optional: true

  clear_the_table:
    documentation: Tell the server that the meal is over and the table can be cleared.
    arguments: []

properties:

  favorite_number:
    documentation: |
      My favorite number
    value:
      name: number
      type: integer

  favorite_foods:
    value:
      name: foods
      type: struct
      structName: favorite_foods

  lunch_menu:
    value:
      name: menu
      type: array
      itemType:
        type: struct
        structName: lunch
      description: The lunch served on each day of the week, starting with Monday.
    readOnly: true
  
  family_name:
    documentation: This is to test a property with a string value.
    value:
      name: family_name
      type: string

  last_breakfast_time:
    documentation: This is to test a property with a datetime value.
    value:
      name: timestamp
      type: datetime

  last_birthdays:
    documentation: This is to test a property with an array of datetime values.
    value:
      name: birthdays
      type: array
      itemType:
        type: datetime
      description: The most recent birthday of each family member.