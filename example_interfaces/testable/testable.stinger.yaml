      - name: input2
        type: duration
      - name: input3
        type: duration
        optional: true
    returnValue:
      name: output1
      type: duration
      description: The returned duration value.

  callOneBinary:
    documentation: Method that takes one binary argument and returns one binary value.
    arguments:
      - name: input1
        type: binary
        contentType: application/octet-stream
    returnValue:
      name: output1
      type: binary
      contentType: application/octet-stream
  
  callOptionalBinary:
    documentation: Method that takes one optional binary argument and returns one optional binary value.
    arguments:
      - name: input1
        type: binary
        contentType: application/octet-stream
        optional: true
    returnValue:
      name: output1
      type: binary
      contentType: application/octet-stream
      optional: true
        
  callThreeBinaries:
    documentation: Method that takes three binary arguments, the third is optional, and returns one binary value.
    arguments:
      - name: input1
        type: binary
        contentType: application/octet-stream
        description: The first binary input.  The other two don't have descriptions.
      - name: input2
        type: binary
        contentType: application/octet-stream
      - name: input3
        type: binary
        contentType: application/octet-stream
        optional: true
    returnValue:
      name: output1
      type: binary
      contentType: application/octet-stream
      description: The returned binary value.

  callOneListOfIntegers:
    documentation: Method that takes one list of integers argument and returns one list of integers value.
    arguments:
      - name: input1
        type: array
        itemType:
          type: integer
    returnValue:
      name: output1
      type: array
      itemType:
        type: integer

  callOptionalListOfFloats:
    documentation: Method that takes one optional list of floats argument and returns one optional list of floats value.
    arguments:
      - name: input1
        type: array
        itemType:
          type: float
        optional: true
    returnValue:
      name: output1
      type: array
      itemType:
        type: float
      optional: true

  callTwoLists:
    documentation: Method that takes two list arguments, the second is optional, and returns one list value.
    arguments:
      - name: input1
        type: array
        itemType:
          type: enum
          enumName: Numbers
          enumVersion: 2.0.0
        description: The first list of enums.
      - name: input2
        type: array
        itemType:
          type: string
        optional: true
    returnValue:
      name: output1
      type: array
      itemType:
        type: enum
        enumName: Numbers
        enumVersion: 2.0.0
      description: The first list of enums.
    version: 0.1.0

