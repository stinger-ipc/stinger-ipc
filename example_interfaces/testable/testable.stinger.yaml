stingeripc:
  version: 0.3.0

interface:
  name: testable
  version: 0.0.1
  title: Interface for testing
  summary: This tries to capture most variants of features.

enums:

  Numbers:
    values:
      - name: one
        value: 1
        description: The number one
      - name: two
        value: 2
      - name: three
        value: 3
        description: Value two has no description.
    version: 2.0.0

structures:

  entry:
    members:
      - name: key
        type: integer
        description: An identifier.
      - name: value
        type: string
        description: A name.

  lunch:
    $ref: "extra.yaml#/structures/lunch"

  AllTypes:
    members:
      - name: the_bool
        type: boolean
      - name: the_int
        type: integer
      - name: the_number
        type: float
        description: A floating point number.  Bool and int do not have descriptions.
      - name: the_str
        type: string
        description: A string type.
      - name: the_enum
        type: enum
        enumName: Numbers
        enumVersion: 2.0.0
        description: An enum type
      - name: an_entry_object
        type: struct
        structName: lunch
        structVersion: 1.2.3
        description: A struct type.
      - name: date_and_time
        type: datetime
        description: A date and time type.
      - name: time_duration
        type: duration
        description: A duration type.
      - name: data
        type: binary
        contentType: application/octet-stream
        description: A binary type.
      - name: OptionalInteger
        type: integer
        optional: true
        description: An optional integer type.
      - name: OptionalString
        type: string
        optional: true
        description: An optional string type.
      - name: OptionalEnum
        type: enum
        enumName: Numbers
        optional: true
        description: An optional enum type, one of the numbers.
      - name: optionalEntryObject
        type: struct
        structName: entry
        optional: true
        description: An optional struct type.
      - name: OptionalDateTime
        type: datetime
        optional: true
        description: An optional date and time type.
      - name: OptionalDuration
        type: duration
        optional: true
        description: An optional duration type.
      - name: OptionalBinary
        type: binary
        contentType: application/octet-stream
        optional: true
        description: An optional binary type.
      - name: array_of_integers
        type: array
        itemType:
          type: integer
        description: An array of integers.
      - name: optional_array_of_integers
        type: array
        itemType:
          type: integer
        optional: true
        description: An optional array of integers.
      - name: array_of_strings
        type: array
        itemType:
          type: string
        description: An array of strings.
      - name: optional_array_of_strings
        type: array
        itemType:
          type: string
        optional: true
        description: An optional array of strings.
      - name: array_of_enums
        type: array
        itemType:
          type: enum
          enumName: Numbers
        description: An array of enums.
      - name: optional_array_of_enums
        type: array
        itemType:
          type: enum
          enumName: Numbers
        optional: true
        description: An optional array of enums.
      - name: array_of_datetimes
        type: array
        itemType:
          type: datetime
        description: An array of date and time values.
      - name: optional_array_of_datetimes
        type: array
        itemType:
          type: datetime
        optional: true
        description: An optional array of date and time values.
      - name: array_of_durations
        type: array
        itemType:
          type: duration
        description: An array of duration values.
      - name: optional_array_of_durations
        type: array
        itemType:
          type: duration
        optional: true
        description: An optional array of duration values.
      - name: array_of_binaries
        type: array
        itemType:
          type: binary
          contentType: application/octet-stream
        description: An array of binary values.
      - name: optional_array_of_binaries
        type: array
        itemType:
          type: binary
          contentType: application/octet-stream
        optional: true
        description: An optional array of binary values.
      - name: array_of_entry_objects
        type: array
        itemType:
          type: struct
          structName: entry
        description: An array of struct values.
      - name: optional_array_of_entry_objects
        type: array
        itemType:
          type: struct
          structName: entry
        optional: true
        description: An optional array of struct values.

signals:

  empty:
    documentation: A signal with no parameters.
    payload: []

  singleInt:
    documentation: A signal with a single integer parameter.
    payload:
      - name: value
        type: integer
        description: The integer value.
  
  jsonSchemaValidatedInt:
    documentation: A signal with a single integer parameter that is validated against a JSON schema.
    payload:
      - name: value
        type: integer
        description: The integer value.
        schema:
          minimum: 0
          maximum: 100

  singleOptionalInt:
    documentation: A signal with a single optional integer parameter.
    payload:
      - name: value
        type: integer
        optional: true
        description: The integer value.

  threeIntegers:
    documentation: A signal with three integer parameters, the third is optional.
    payload:
      - name: first
        type: integer
        description: The first integer value.
      - name: second
        type: integer
        description: The second integer value.
      - name: third
        type: integer
        description: The third integer value.
        optional: true

  singleString:
    documentation: A signal with a single string parameter.
    payload:
      - name: value
        type: string
        description: The string value.
  
  jsonSchemaValidatedString:
    documentation: A signal with a single string parameter that is validated against a JSON schema.
    payload:
      - name: value
        type: string
        description: The string value.
        schema:
          minLength: 1
          maxLength: 10

  singleOptionalString:
    documentation: A signal with a single optional string parameter.
    payload:
      - name: value
        type: string
        optional: true
        description: The string value.
  
  threeStrings:
    documentation: A signal with three string parameters, the third is optional.
    payload:
      - name: first
        type: string
        description: The first string value.
      - name: second
        type: string
        description: The second string value.
      - name: third
        type: string
        description: The third string value.
        optional: true

  singleEnum:
    documentation: A signal with a single enum parameter.
    payload:
      - name: value
        type: enum
        enumName: Numbers
        enumVersion: 2.0.0
        description: The enum value.
    version: 0.1.0

  singleOptionalEnum:
    documentation: A signal with a single optional enum parameter.
    payload:
      - name: value
        type: enum
        enumName: Numbers
        optional: true
        description: The enum value.

  threeEnums:
    documentation: A signal with three enum parameters, the third is optional.
    payload:
      - name: first
        type: enum
        enumName: Numbers
        description: The first enum value.
      - name: second
        type: enum
        enumName: Numbers
        description: The second enum value.
      - name: third
        type: enum
        enumName: Numbers
        description: The third enum value.
        optional: true
  
  singleStruct:
    documentation: A signal with a single struct parameter.
    payload:
      - name: value
        type: struct
        structName: AllTypes
        description: The struct value.
  
  singleOptionalStruct:
    documentation: A signal with a single optional struct parameter.
    payload:
      - name: value
        type: struct
        structName: AllTypes
        optional: true
        description: The struct value.

  threeStructs:
    documentation: A signal with three struct parameters, the third is optional.
    payload:
      - name: first
        type: struct
        structName: AllTypes
        description: The first struct value.
      - name: second
        type: struct
        structName: AllTypes
        description: The second struct value.
      - name: third
        type: struct
        structName: AllTypes
        description: The third struct value.
        optional: true
  
  singleDateTime:
    documentation: A signal with a single date and time parameter.
    payload:
      - name: value
        type: datetime
        description: The date and time value.
  
  singleOptionalDatetime:
    documentation: A signal with a single optional date and time parameter.
    payload:
      - name: value
        type: datetime
        optional: true
        description: The date and time value.
  
  threeDateTimes:
    documentation: A signal with three date and time parameters, the third is optional.
    payload:
      - name: first
        type: datetime
        description: The first date and time value.
      - name: second
        type: datetime
        description: The second date and time value.
      - name: third
        type: datetime
        description: The third date and time value.
        optional: true
  
  singleDuration:
    documentation: A signal with a single duration parameter.
    payload:
      - name: value
        type: duration
        description: The duration value.

  singleOptionalDuration:
    documentation: A signal with a single optional duration parameter.
    payload:
      - name: value
        type: duration
        optional: true
        description: The duration value.

  threeDurations:
    documentation: A signal with three duration parameters, the third is optional.
    payload:
      - name: first
        type: duration
        description: The first duration value.
      - name: second
        type: duration
        description: The second duration value.
      - name: third
        type: duration
        description: The third duration value.
        optional: true
  
  singleBinary:
    documentation: A signal with a single binary parameter.
    payload:
      - name: value
        type: binary
        contentType: application/octet-stream
        description: The binary value.

  singleOptionalBinary:
    documentation: A signal with a single optional binary parameter.
    payload:
      - name: value
        type: binary
        contentType: application/octet-stream
        optional: true
        description: The binary value.

  threeBinaries:
    documentation: A signal with three binary parameters, the third is optional.
    payload:
      - name: first
        type: binary
        contentType: application/octet-stream
        description: The first binary value.
      - name: second
        type: binary
        contentType: application/octet-stream
        description: The second binary value.
      - name: third   
        type: binary
        contentType: application/octet-stream
        description: The third binary value.
        optional: true

  singleArrayOfIntegers:
    documentation: A signal with an array of integers.
    payload:
      - name: values
        type: array
        itemType:
          type: integer
        description: The array of integers.

  singleOptionalArrayOfStrings:
    documentation: A signal with an optional array of strings.
    payload:
      - name: values
        type: array
        itemType:
          type: string
        optional: true
        description: The array of strings.

  arrayOfEveryType:
    payload:
      - name: first_of_integers
        type: array
        itemType:
          type: integer
        description: The first array of integers.
      - name: second_of_floats
        type: array
        itemType:
          type: float
        description: The second array of floats.
      - name: third_of_strings
        type: array
        itemType:
          type: string
        description: The third array of strings.
      - name: fourth_of_enums
        type: array
        itemType:
          type: enum
          enumName: Numbers
        description: The fourth array of enums.
      - name: fifth_of_structs
        type: array
        itemType:
          type: struct
          structName: entry
        description: The fifth array of structs.
      - name: sixth_of_datetimes
        type: array
        itemType:
          type: datetime
        description: The sixth array of date and time values.
      - name: seventh_of_durations
        type: array
        itemType:
          type: duration
        description: The seventh array of duration values.
      - name: eighth_of_binaries
        type: array
        itemType:
          type: binary
          contentType: application/octet-stream
        description: The eighth array of binary values.

methods:

  callWithNothing:
    documentation: Method that takes no arguments and returns nothing.
    arguments: []

  callOneInteger:
    documentation: Method that takes one integer argument and returns one integer value.
    arguments:
      - name: input1
        type: integer
    returnValue:
      name: output1
      type: integer

  callOptionalInteger:
    documentation: Method that takes one optional integer argument and returns one optional integer value.
    arguments:
      - name: input1
        type: integer
        optional: true
    returnValue:
      name: output1
      type: integer
      optional: true
  
  callThreeIntegers:
    documentation: Method that takes three integer arguments, the third is optional, and returns one integer value.
    arguments:
      - name: input1
        type: integer
        description: The first integer input.  The other two don't have descriptions.
      - name: input2
        type: integer
      - name: input3
        type: integer
        optional: true
    returnValue:
      name: output1
      type: integer
      description: The returned integer value.

  callOneString:
    documentation: Method that takes one string argument and returns one string value.
    arguments:
      - name: input1
        type: string
    returnValue:
      name: output1 
      type: string

  callOptionalString:
    documentation: Method that takes one optional string argument and returns one optional string value.
    arguments:
      - name: input1
        type: string
        optional: true
    returnValue:
      name: output1 
      type: string
      optional: true

  callThreeStrings:
    documentation: Method that takes three string arguments, the 2nd is optional, and returns one string value.
    arguments:
      - name: input1
        type: string
        description: The first string input.  The other two don't have descriptions.
      - name: input2
        type: string
        optional: true
      - name: input3
        type: string
    returnValue:
      name: output1 
      type: string
      description: The returned string value.

  callOneEnum:
    documentation: Method that takes one enum argument and returns one enum value.
    arguments:
      - name: input1
        type: enum
        enumName: Numbers
    returnValue:
      name: output1 
      type: enum
      enumName: Numbers

  callOptionalEnum:
    documentation: Method that takes one optional enum argument and returns one optional enum value.
    arguments:
      - name: input1
        type: enum
        enumName: Numbers
        optional: true
    returnValue:
      name: output1 
      type: enum
      enumName: Numbers
      optional: true 

  callThreeEnums:
    documentation: Method that takes three enum arguments, the third is optional, and returns one enum value.
    arguments:
      - name: input1
        type: enum
        enumName: Numbers
        description: The first enum input.  The other two don't have descriptions.
      - name: input2
        type: enum
        enumName: Numbers
      - name: input3
        type: enum
        enumName: Numbers
        optional: true
    returnValue:
      name: output1 
      type: enum
      enumName: Numbers
      description: The returned enum value.

  callOneStruct:
    documentation: Method that takes one struct argument and returns one struct value.
    arguments:
      - name: input1
        type: struct
        structName: AllTypes
    returnValue:
      name: output1
      type: struct
      structName: AllTypes

  callOptionalStruct:
    documentation: Method that takes one optional struct argument and returns one optional struct value.
    arguments:
      - name: input1
        type: struct
        structName: AllTypes
        optional: true
    returnValue:
      name: output1 
      type: struct
      structName: AllTypes
      optional: true

  callThreeStructs:
    documentation: Method that takes three struct arguments, the first is optional, and returns one optional struct value.
    arguments:
      - name: input1
        type: struct
        structName: AllTypes
        description: The first struct input.  The other two don't have descriptions.
        optional: true
      - name: input2
        type: struct
        structName: AllTypes
      - name: input3
        type: struct
        structName: AllTypes
    returnValue:
      name: output1 
      type: struct
      structName: AllTypes
      description: The returned struct value.
      optional: true
  
  callOneDateTime:
    documentation: Method that takes one date and time argument and returns one date and time value.
    arguments:
      - name: input1
        type: datetime
    returnValue:
