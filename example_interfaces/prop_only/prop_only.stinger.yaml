stingeripc:
  version: 0.3.0

interface:
  name: prop-only
  version: 0.0.1
  title: Property Only Interface
  summary: Example StingerAPI interface which only has properties, plus a struct and an enum.

configuration:

  topics:
    params: ["prefix"]
    signals: "{prefix}/{interface_name}/{service_id}/signal/{signal_name}"
    propertyValues: "{prefix}/{interface_name}/{service_id}/property/{property_name}/value"
    propertyUpdates: "{prefix}/{interface_name}/{service_id}/property/{property_name}/update"
    commands: "{prefix}/{interface_name}/{service_id}/command/{command_name}"
    methodRequests: "{prefix}/{interface_name}/{service_id}/method/{method_name}/request"
    interfaceDiscovery: "{prefix}/{interface_name}/{service_id}/interface"

structures:

  address:
    documentation: Structure representing a mailing address.
    values:
      - name: street
        type: string
        description: The street address.
      - name: city
        type: string
        description: The city name.
      - name: state
        type: string
        description: The state or province.
      - name: postal_code
        type: string
        description: The postal or ZIP code.
      - name: country
        type: enum
        enumName: country

enums:

  country:
    documentation: A small set of supported countries.
    values:
      - name: USA
        description: United States of America.
      - name: Canada
      - name: Mexico

properties:

  home_address:
    documentation: The current home address.
    value:
      name: address
      type: struct
      structName: address

  favorite_country:
    documentation: The user's favorite country.
    value:
      name: country
      type: enum
      enumName: country
