stingeripc:
  version: 0.3.0

interface:
  name: Simple
  version: 0.0.1
  title: Simple Example Interface
  summary: Example StingerAPI interface which demonstrates just a bit.

configuration:

  topics:
    params: ["prefix"]
    signals: "{prefix}/{interface_name}/{service_id}/signal/{signal_name}"
    propertyValues: "{prefix}/{interface_name}/{service_id}/property/{property_name}/value"
    propertyUpdates: "{prefix}/{interface_name}/{service_id}/property/{property_name}/update"
    commands: "{prefix}/{interface_name}/{service_id}/command/{command_name}"
    methodRequests: "{prefix}/{interface_name}/{service_id}/method/{method_name}/request"
    interfaceDiscovery: "{prefix}/{interface_name}/{service_id}/interface"

structures:

  person:
    values:
      - name: name
        type: string
        description: The name of the person
      - name: gender
        type: enum
        enumName: gender
        description: The gender of the person.

enums:

  gender:
    values:
      - name: male
      - name: female
      - name: other

signals:
  
  person_entered:
    values:
      - name: person
        type: struct
        structName: person

methods:

  trade_numbers:
    documentation: A simple method which trades favorite numbers.
    arguments:
      - name: your_number
        type: integer
        description: Your favorite number.
        schema:
          minimum: 0
          maximum: 10000
    returnValue:
      name: my_number
      type: integer
      description: My favorite number
  
commands:

  ring_the_bell:
    documentation: A simple command telling the server to ring the school bell.
    arguments:
      - name: times
        type: integer
        description: How many times to ring the bell.
        schema:
          minimum: 1
          maximum: 12

properties:

  school:
    value:
      name: name
      type: string
      description: The name of the school where the person studies.

constants:

  pi:
    type: float
    value: 3.14159
    description: The mathematical constant pi.